name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref containing the package version (use a tag for normal releases)
        required: true
        default: main
        type: string
      release_version:
        description: Exact package version to publish, for example 0.3.12
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - id: source
        name: Resolve release source exactly once
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: resolve
    uses: ./.github/workflows/native-build.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  publish:
    needs: [resolve, native]
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY: https://registry.npmjs.org
      RELEASE_REF: ${{ inputs.release_ref || github.ref }}
      RELEASE_VERSION_INPUT: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Verify npm Trusted Publishing runtime
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          node -e '
            const major = Number(process.versions.node.split(".")[0]);
            if (major !== 24) {
              throw new Error(`Node ${process.version} is unsupported for this release; require Node 24`);
            }
          '
          npm_version="$(npm --version)"
          # shellcheck disable=SC2016
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              throw new Error(`npm ${process.argv[1]} is too old for Trusted Publishing; require npm >= 11.5.1`);
            }
          ' "$npm_version"
      - name: Verify immutable release artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.native.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.native.outputs.artifact_digest }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${process.env.ARTIFACT_ID}`, {
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Artifact lookup failed: ${response.status}`);
          const artifact = await response.json();
          const digest = process.env.ARTIFACT_DIGEST.replace(/^sha256:/, '');
          if (!/^[a-f0-9]{64}$/.test(digest) || artifact.digest !== `sha256:${digest}` || artifact.expired || String(artifact.workflow_run?.id) !== process.env.GITHUB_RUN_ID) throw new Error('Native release artifact identity mismatch');
          JS
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.native.outputs.artifact_id }}
          path: .tmp/native-release
          digest-mismatch: error
      - name: Install verified prebuilt assets into compiler package
        run: node native/scripts/install-release.mjs .tmp/native-release/native
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Validate trusted publish package contents
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="${RELEASE_REF#refs/tags/}"
            version="${version#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be semver, received: $version" >&2
            exit 1
          fi
          manifest_version="$(node -p 'JSON.parse(require("fs").readFileSync("packages/intl/package.json", "utf8")).version')"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "Release version $version does not match package version $manifest_version" >&2
            exit 1
          fi
          if [[ "$RELEASE_REF" == refs/tags/* || "$RELEASE_REF" == v* ]]; then
            tag_version="${RELEASE_REF#refs/tags/}"
            tag_version="${tag_version#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release ref $RELEASE_REF does not match release version $version" >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          corepack pnpm run release:packages:npm:preflight -- "$version"
      - name: Publish packages to npm
        run: |
          set -euo pipefail
          corepack pnpm run release:packages:npm -- "$RELEASE_VERSION"
