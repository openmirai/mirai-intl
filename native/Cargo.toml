[package]
name = "mirai-intl-engine"
version = "0.3.29"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mirai-intl-worker"
path = "src/main.rs"

[features]
default = []
addon = ["dep:napi", "dep:napi-derive"]
oxc = ["dep:oxc_parser", "dep:oxc_allocator", "dep:oxc_span"]

[dependencies]
napi = { version = "=3.12.2", optional = true, default-features = false, features = [
  "napi8",
  "dyn-symbols",
] }
napi-derive = { version = "=3.6.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"
ryu-js = "=1.0.3"
rayon = "1.11"
libc = "0.2"
oxc_parser = { version = "=0.149.0", optional = true }
oxc_allocator = { version = "=0.149.0", optional = true }
oxc_span = { version = "=0.149.0", optional = true }

[build-dependencies]
napi-build = "=2.4.1"

[profile.release]
lto = "thin"
strip = "symbols"
